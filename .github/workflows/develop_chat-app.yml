# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - chat-app

on:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: npm install, build, and test
        run: |
          npm ci
          npm run build
          npm run test --if-present

      - name: Prepare standalone deploy package
        run: |
          rm -rf deploy
          mkdir -p deploy/.next
          cp -R .next/standalone/* deploy/
          cp -R .next/static deploy/.next/static
          if [ -d public ]; then
            cp -R public deploy/public
          fi

      - name: Archive deploy package
        run: |
          cd deploy
          zip -r ../release.zip .
          cd ..
          ls -lh release.zip

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app-zip
          path: release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app-zip
          path: .

      - name: Verify release archive
        run: |
          echo "PWD: $(pwd)"
          ls -la
          test -f release.zip
          unzip -l release.zip | head -n 40
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_5CA27F37AE954E03AE39EBD5E6505A0F }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_EF45866290824D3B9496161268A94E44 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_06DA9CB278F14066BA51057156CF7993 }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'chat-app'
          slot-name: 'Production'
          package: release.zip
          
